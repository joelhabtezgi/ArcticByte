<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="polarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="35" fill="url(#polarGradient)" opacity="0.1"/>
  
  <!-- Polar bear silhouette -->
  <g transform="translate(15, 20)">
    <!-- Bear body -->
    <ellipse cx="25" cy="25" rx="18" ry="12" fill="url(#polarGradient)"/>
    <!-- Bear head -->
    <circle cx="25" cy="12" r="10" fill="url(#polarGradient)"/>
    <!-- Bear ears -->
    <circle cx="20" cy="6" r="3" fill="url(#polarGradient)"/>
    <circle cx="30" cy="6" r="3" fill="url(#polarGradient)"/>
    <!-- Bear nose -->
    <circle cx="25" cy="12" r="1.5" fill="#2c3e50"/>
    <!-- Bear eyes -->
    <circle cx="22" cy="10" r="1" fill="#2c3e50"/>
    <circle cx="28" cy="10" r="1" fill="#2c3e50"/>
  </g>
  
  <!-- Tech elements - Binary pattern -->
  <g fill="url(#techGradient)" opacity="0.6" font-family="monospace" font-size="8">
    <text x="70" y="15">01001000</text>
    <text x="70" y="25">01011001</text>
    <text x="70" y="35">01110100</text>
    <text x="70" y="45">01100101</text>
  </g>
  
  <!-- Geometric tech shapes -->
  <g fill="url(#techGradient)" opacity="0.4">
    <polygon points="85,55 95,55 90,65" />
    <rect x="75" y="60" width="8" height="8" rx="1"/>
    <circle cx="100" cy="58" r="3"/>
  </g>
  
  <!-- Company name -->
  <text x="5" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">ArcticByte</text>
</svg>